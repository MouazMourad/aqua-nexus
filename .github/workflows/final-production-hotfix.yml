name: Apply TestSprite closure fixes

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/final-production-hotfix.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply closure patch
        run: |
          python3 scripts/apply_testsprite_closure.py
          python3 scripts/fix_timeline_event_i18n.py

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit fixes
        run: |
          git config user.name "Aqua Nexus CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/domain/aquaAIBrain.ts src/components/AquaAIAssistant.tsx src/components/pages/TimelinePage.tsx src/components/pages/MaintenancePage.tsx src/components/pages/LivestockPage.tsx src/i18n/index.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: localize final timeline event tokens"
          git push origin main
