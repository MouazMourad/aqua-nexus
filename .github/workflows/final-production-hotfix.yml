name: Apply TestSprite closure fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-production-hotfix.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch remaining TestSprite findings
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def replace(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s:
                  raise SystemExit(f"target missing: {path}: {old[:80]}")
              p.write_text(s.replace(old,new,1))

          # Timeline: localize page eyebrow and all raw event tokens.
          replace('src/components/pages/TimelinePage.tsx',
                  'PageHeader eyebrow="TANK TIMELINE" title={tr(lang,"timeline")}',
                  'PageHeader eyebrow={bi(lang,"السجل الزمني للحوض","TANK TIMELINE")} title={tr(lang,"timeline")}')
          replace('src/components/pages/TimelinePage.tsx',
                  '<small className="eyebrow-mini">LONG-TERM HISTORY</small>',
                  '<small className="eyebrow-mini">{bi(lang,"التاريخ طويل الأمد","LONG-TERM HISTORY")}</small>')
          replace('src/components/pages/TimelinePage.tsx',
                  '{x.source==="intelligence"?" • Tank Brain":""}',
                  '{x.source==="intelligence"?` • ${bi(lang,"عقل الحوض","Tank Brain")}`:""}')

          p=Path('src/i18n/index.ts'); s=p.read_text()
          start=s.index('export function eventTypeText(')
          new='''export function eventTypeText(lang:Language,type:string){
            const labels:Record<string,[string,string]>={
              "core:livestock:added":["إضافة كائن","Livestock added"],
              "core:livestock:observation_updated":["تحديث ملاحظة كائن","Livestock observation updated"],
              "core:maintenance:scheduled":["جدولة صيانة","Maintenance scheduled"],
              "core:system:coverage_checkpoint":["تحديث تغطية النظام","System coverage update"],
              "core:system:tank_identity_changed":["تغيير هوية الحوض","Tank identity changed"],
              "core:acclimation:started":["بدء الإقلمة","Acclimation started"],
              "core:acclimation:progress":["تقدم الإقلمة","Acclimation progress"],
              "core:dosing:dose_given":["تسجيل جرعة","Dose recorded"],
              "core:equipment:changed":["تغيير جهاز","Equipment changed"],
              "core:equipment:configuration_changed":["تغيير إعداد جهاز","Equipment configuration changed"],
              "core:equipment:installed":["إضافة جهاز","Equipment installed"],
              "recovery":["تعافٍ","Recovery"], "chemistry":["كيمياء","Chemistry"],
              "warning":["تنبيه","Warning"], "setup":["إعداد","Setup"],
              "manual":["يدوي","Manual"], "maintenance":["صيانة","Maintenance"],
              "livestock":["كائنات الحوض","Livestock"], "livestock-observation":["ملاحظة كائن","Livestock observation"],
              "livestock-death":["وفاة كائن","Livestock death"], "livestock-sold":["بيع كائن","Livestock sold"],
              "livestock-transferred":["نقل كائن","Livestock transferred"], "livestock-returned":["إرجاع كائن","Livestock returned"],
              "livestock-removed":["إزالة كائن","Livestock removed"], "history-archive":["أرشفة السجل","History archive"],
              "ai-action-plan":["خطة عقل الحوض","Tank Brain action plan"], "ai-action-outcome":["نتيجة خطة عقل الحوض","Tank Brain plan outcome"],
              "dosing":["جرعة","Dosing"], "dosing-step":["خطوة جرعة","Dosing step"],
              "dosing-plan-invalidated":["إيقاف خطة جرعات","Dosing plan stopped"], "feeding":["تغذية","Feeding"],
              "water-change":["تغيير ماء","Water change"], "equipment":["معدات","Equipment"],
              "acclimation":["إقلمة","Acclimation"], "emergency":["طوارئ","Emergency"],
              "travel":["سفر وغياب","Travel"], "observation":["ملاحظة","Observation"]
            };
            const direct=labels[type];
            if(direct)return lang==="ar"?direct[0]:direct[1];
            if(type.startsWith("core:"))return lang==="ar"?"سجل نظام":"System record";
            if(lang==="ar")return "حدث بالحوض";
            return type.replace(/[-_:]+/g," ").replace(/\\b\\w/g,c=>c.toUpperCase());
          }'''
          s=s[:start]+new+'\n'
          p.write_text(s)

          # Maintenance: remove English-only shell and micro-headings in Arabic mode.
          replace('src/components/pages/MaintenancePage.tsx',
                  'PageHeader eyebrow="MAINTENANCE" title={tr(lang,"maintenance")}',
                  'PageHeader eyebrow={bi(lang,"الصيانة","MAINTENANCE")} title={tr(lang,"maintenance")}')
          replace('src/components/pages/MaintenancePage.tsx',
                  '<small className="eyebrow-mini">TODAY</small>',
                  '<small className="eyebrow-mini">{bi(lang,"اليوم","TODAY")}</small>')
          replace('src/components/pages/MaintenancePage.tsx',
                  '<small className="eyebrow-mini">TRAVEL / ABSENCE MODE</small>',
                  '<small className="eyebrow-mini">{bi(lang,"وضع السفر والغياب","TRAVEL / ABSENCE MODE")}</small>')

          # Freshwater AI: broad chemistry intent must win before lighting and return concrete targets.
          p=Path('src/domain/aquaAIBrain.ts'); s=p.read_text()
          old='''  const q=(question||"").trim().toLowerCase();
  const lightingQ=normText(question);
  const lightingTokens=["انار","اضاء","ضوء","ضو","lighting","light","photoperiod","spectrum","par","uv","royal blue"];
  const freshwaterChemistryQuestion =
    tank.type==="freshwater" &&
    /freshwater parameters?|water parameters?/.test(lightingQ) &&
    /water change|تغيير ماء|تغيير مي/.test(lightingQ);
  if(freshwaterChemistryQuestion){
    return freshwaterChemistryAnswer(tank);
  }
  if(lightingTokens.some(token=>lightingQ.includes(token)))return lightingAnswer(tank);
  const intent=parseAquaQuestion(question);'''
          new='''  const q=(question||"").trim().toLowerCase();
  const lightingQ=normText(question);
  const intent=parseAquaQuestion(question);
  const freshwaterChemistryTokens=["freshwater parameter","water parameter","chemistry","chemical","ammonia","nh3","nh4","nitrite","no2","nitrate","no3","gh","kh","water change","كيميا","كيمياء","امونيا","أمونيا","نتريت","نترات","تغيير ماء","تغيير مي","تغيير المي","معايير الماء","قيم الماء"];
  const freshwaterChemistryQuestion=tank.type==="freshwater" && (intent.topics.includes("chemistry") || intent.mode==="waterChange" || freshwaterChemistryTokens.some(token=>lightingQ.includes(normText(token))));
  if(freshwaterChemistryQuestion)return freshwaterChemistryAnswer(tank);
  const lightingTokens=["انار","اضاء","ضوء","ضو","lighting","light","photoperiod","spectrum","par","uv","royal blue"];
  if(lightingTokens.some(token=>lightingQ.includes(token)))return lightingAnswer(tank);'''
          if old not in s: raise SystemExit('freshwater routing target missing')
          s=s.replace(old,new,1)
          old2='''    detailsAr:[...rows,water.summaryAr,...water.detailsAr],
    detailsEn:[...rows,water.summaryEn,...water.detailsEn],'''
          new2='''    detailsAr:[...rows,"أهداف الأمان العامة: NH3/NH4 = 0 ppm، NO2 = 0 ppm، ويفضل إبقاء NO3 عادةً دون 20–40 ppm حسب حساسية الكائنات.","GH وKH لا يملكان رقماً واحداً مناسباً لكل أحواض المياه العذبة؛ الهدف يعتمد على الأنواع وماء المصدر، والأهم تجنب التغيير السريع.","كخط أساس لحوض مستقر: تغيير 20–30% أسبوعياً مناسب غالباً، ثم تُعدل النسبة والتكرار حسب NH3/NO2/NO3 واتجاه القراءات.",water.summaryAr,...water.detailsAr],
    detailsEn:[...rows,"General safety targets: NH3/NH4 = 0 ppm, NO2 = 0 ppm, and NO3 is commonly kept below about 20–40 ppm depending on livestock sensitivity.","GH and KH do not have one universal freshwater target; the appropriate range depends on livestock and source water, and rapid changes should be avoided.","For a stable tank, a 20–30% weekly water change is a common baseline; adjust percentage and frequency from NH3/NO2/NO3 and their trend.",water.summaryEn,...water.detailsEn],'''
          if old2 not in s: raise SystemExit('freshwater answer target missing')
          p.write_text(s.replace(old2,new2,1))
          PY
      - name: Test and build
        run: |
          npm install
          npm test
          npm run build
      - name: Commit fixes
        run: |
          git config user.name "Aqua Nexus CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/domain/aquaAIBrain.ts src/components/pages/TimelinePage.tsx src/components/pages/MaintenancePage.tsx src/i18n/index.ts
          git commit -m "fix: close remaining TestSprite E2E findings"
          git push origin main