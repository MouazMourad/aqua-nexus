name: Apply final E2E fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-final-e2e-fixes.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply requested fixes
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, count=1):
              p=Path(path); s=p.read_text()
              if old not in s:
                  raise SystemExit(f'Expected text not found in {path}: {old[:100]}')
              p.write_text(s.replace(old,new,count))

          # 1) Block empty manual maintenance tasks.
          replace('src/components/pages/MaintenancePage.tsx',
            ' const add=()=>{if(cycle.active)return;patch(tank.id,t=>({...t,maintenance:[...t.maintenance,{id:uid("task"),title:title.trim()||titleEn.trim(),titleEn:titleEn.trim()||title.trim(),cadence,done:false,nextDue:today(),manual:true}]}));setOpen(false)};',
            ''' const add=()=>{\n  if(cycle.active)return;\n  const ar=title.trim();\n  const en=titleEn.trim();\n  if(!ar&&!en){\n    window.alert(\n      bi(\n        lang,\n        "اكتب اسم المهمة قبل الحفظ.",\n        "Enter a task name before saving."\n      )\n    );\n    return;\n  }\n  patch(tank.id,t=>({\n    ...t,\n    maintenance:[\n      ...t.maintenance,\n      {\n        id:uid("task"),\n        title:ar||en,\n        titleEn:en||ar,\n        cadence,\n        done:false,\n        nextDue:today(),\n        manual:true\n      }\n    ]\n  }));\n  setTitle("");\n  setTitleEn("");\n  setOpen(false);\n };''')

          # 2) Full timestamps for livestock additions.
          p=Path('src/components/pages/LivestockPage.tsx'); s=p.read_text()
          s=s.replace('import { tr,bi,categoryText } from "@/i18n";','import { tr,bi,categoryText,statusText } from "@/i18n";',1)
          s=s.replace('addedAt:today()','addedAt:nowISO()',1)
          s=s.replace('>{x.health}</span>','>{statusText(lang,x.health)}</span>',1)
          p.write_text(s)

          # LibraryPage is already on nowISO in current main; enforce it without changing correct code.
          p=Path('src/components/pages/LibraryPage.tsx'); s=p.read_text()
          if 'addedAt:today()' in s:
              s=s.replace('addedAt:today()','addedAt:nowISO()')
          s=s.replace('import { uid,today,nowISO } from "@/lib/appUtils";','import { uid,nowISO } from "@/lib/appUtils";')
          if 'import { uid,nowISO } from "@/lib/appUtils";' not in s:
              raise SystemExit('LibraryPage nowISO import missing')
          p.write_text(s)

          # 3) Freshwater chemistry routing before lighting routing.
          p=Path('src/domain/aquaAIBrain.ts'); s=p.read_text()
          marker='function waterChangeAnswer(tank:Tank):AquaAIAnswer{'
          helper='''function freshwaterChemistryAnswer(tank:Tank):AquaAIAnswer{\n  const latest=(measuredChemistryReadings(tank)[0]?.values??{}) as Record<string,unknown>;\n  const rows=["GH","KH","NO3","NH3"].map(key=>{\n    const value=latest[key];\n    return value===undefined\n      ? `لا توجد قراءة ${key} مسجلة حالياً.`\n      : `آخر قراءة ${key}: ${String(value)}.`;\n  });\n  const water=waterChangeAnswer(tank);\n  return {\n    titleAr:"كيمياء المياه العذبة وخطة تغيير الماء",\n    titleEn:"Freshwater chemistry and water-change plan",\n    summaryAr:"راقب GH وKH والنترات والأمونيا أولاً، ثم قرر تغيير الماء بناءً على القراءات واتجاهها.",\n    summaryEn:"Watch GH, KH, nitrate, and ammonia first, then decide on a water change from the readings and their trend.",\n    detailsAr:[...rows,water.summaryAr,...water.detailsAr],\n    detailsEn:[...rows,water.summaryEn,...water.detailsEn],\n    evidenceAr:[...water.evidenceAr,"توجيه مياه عذبة"],\n    evidenceEn:[...water.evidenceEn,"Freshwater routing"],\n    confidence:confidence(tank),\n    action:{\n      page:"chemistry",\n      ar:"افتح الكيمياء وسجّل القراءات التالية",\n      en:"Open Chemistry and log the next readings"\n    }\n  };\n}\n\n'''
          if 'function freshwaterChemistryAnswer' not in s:
              if marker not in s: raise SystemExit('waterChangeAnswer marker missing')
              s=s.replace(marker,helper+marker,1)
          old='''  const lightingTokens=["انار","اضاء","ضوء","ضو","lighting","light","photoperiod","spectrum","par","uv","royal blue"];\n  if(lightingTokens.some(token=>lightingQ.includes(token)))return lightingAnswer(tank);'''
          new='''  const lightingTokens=["انار","اضاء","ضوء","ضو","lighting","light","photoperiod","spectrum","par","uv","royal blue"];\n  const freshwaterChemistryQuestion =\n    tank.type==="freshwater" &&\n    /freshwater parameters?|water parameters?/.test(lightingQ) &&\n    /water change|تغيير ماء|تغيير مي/.test(lightingQ);\n  if(freshwaterChemistryQuestion){\n    return freshwaterChemistryAnswer(tank);\n  }\n  if(lightingTokens.some(token=>lightingQ.includes(token)))return lightingAnswer(tank);'''
          if 'const freshwaterChemistryQuestion' not in s:
              if old not in s: raise SystemExit('lighting routing marker missing')
              s=s.replace(old,new,1)
          p.write_text(s)

          # 4) i18n keys, crustacean category, and core event labels.
          p=Path('src/i18n/index.ts'); s=p.read_text()
          if 'unknown: "غير معروف"' not in s:
              s=s.replace('    warning: "تنبيه",','    warning: "تنبيه",\n    unknown: "غير معروف",\n    critical: "حرج",\n    crustacean: "قشريات",',1)
          if 'unknown: "Unknown"' not in s:
              s=s.replace('    warning: "Warning",','    warning: "Warning",\n    unknown: "Unknown",\n    critical: "Critical",\n    crustacean: "Crustaceans",',1)
          if 'Crustacean: tr(lang, "crustacean")' not in s:
              s=s.replace('    Other: tr(lang, "other"),','    Other: tr(lang, "other"),\n    Crustacean: tr(lang, "crustacean"),',1)
              s=s.replace('    other: tr(lang, "other"),','    other: tr(lang, "other"),\n    crustacean: tr(lang, "crustacean"),',1)
          if 'export function eventTypeText' not in s:
              s += '''\n\nexport function eventTypeText(lang:Language,type:string){\n  const labels:Record<string,[string,string]>={\n    "core:livestock:added":["إضافة كائن","Livestock added"],\n    "core:livestock:observation_updated":["تحديث ملاحظة كائن","Livestock observation updated"],\n    "core:maintenance:scheduled":["جدولة صيانة","Maintenance scheduled"],\n    "core:system:coverage_checkpoint":["تحديث تغطية النظام","System coverage update"],\n    "core:system:tank_identity_changed":["تغيير هوية الحوض","Tank identity changed"],\n    "core:acclimation:started":["بدء الإقلمة","Acclimation started"],\n    "core:acclimation:progress":["تقدم الإقلمة","Acclimation progress"],\n    "core:dosing:dose_given":["تسجيل جرعة","Dose recorded"],\n    "core:equipment:changed":["تغيير جهاز","Equipment changed"],\n    "core:equipment:configuration_changed":["تغيير إعداد جهاز","Equipment configuration changed"],\n    "core:equipment:installed":["إضافة جهاز","Equipment installed"]\n  };\n  const direct=labels[type];\n  if(direct){\n    return lang==="ar"?direct[0]:direct[1];\n  }\n  if(type.startsWith("core:")){\n    return lang==="ar"?"سجل نظام":"System record";\n  }\n  return type;\n}\n'''
          p.write_text(s)

          # 5/6) Timeline uses translated event labels in filter and rows.
          p=Path('src/components/pages/TimelinePage.tsx'); s=p.read_text()
          s=s.replace('import { tr,bi } from "@/i18n";','import { tr,bi,eventTypeText } from "@/i18n";',1)
          s=s.replace('{types.map(x=><option key={x} value={x}>{x}</option>)}','{types.map(x=>\n  <option key={x} value={x}>\n    {eventTypeText(lang,x)}\n  </option>\n)}',1)
          s=s.replace('<em>{x.type}{x.source==="intelligence"?" • Tank Brain":""}</em>','<em>\n  {eventTypeText(lang,x.type)}\n  {x.source==="intelligence"?" • Tank Brain":""}\n</em>',1)
          p.write_text(s)

      - name: Install, test, build
        run: |
          npm install
          npm test
          npm run build

      - name: Commit fixes to main and remove one-shot workflow
        run: |
          git config user.name "Aqua Nexus CI"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-final-e2e-fixes.yml
          git add src/components/pages/MaintenancePage.tsx src/components/pages/LivestockPage.tsx src/components/pages/LibraryPage.tsx src/domain/aquaAIBrain.ts src/i18n/index.ts src/components/pages/TimelinePage.tsx
          git commit -m "fix: close final E2E issues"
          git push origin main
