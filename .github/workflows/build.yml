name: Aqua Nexus Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Capture generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: package-lock-generated
          path: package-lock.json
          retention-days: 1
      - name: Commit generated lockfile to release branch
        if: github.event_name == 'pull_request' && github.head_ref == 'hardening/release-candidate'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json already tracked"
            exit 0
          fi
          CONTENT="$(base64 -w0 package-lock.json)"
          gh api --method PUT "repos/${{ github.repository }}/contents/package-lock.json" \
            -f message="Add reproducible npm lockfile" \
            -f content="$CONTENT" \
            -f branch="${{ github.head_ref }}"
      - name: Regression tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Critical journey E2E
        run: npm run test:e2e
