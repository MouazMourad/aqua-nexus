name: Aqua Nexus Build

on:
  push:
    branches: [main, hardening/release-candidate]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Capture generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: package-lock-generated
          path: package-lock.json
          retention-days: 1
      - name: Commit generated lockfile to release branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/hardening/release-candidate'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json already tracked"
            exit 0
          fi
          python - <<'PY'
          import base64,json,os
          with open("package-lock.json","rb") as handle:
              content=base64.b64encode(handle.read()).decode("ascii")
          with open("/tmp/package-lock-payload.json","w",encoding="utf-8") as handle:
              json.dump({"message":"Add reproducible npm lockfile","content":content,"branch":os.environ["GITHUB_REF_NAME"]},handle)
          PY
          gh api --method PUT "repos/${{ github.repository }}/contents/package-lock.json" --input /tmp/package-lock-payload.json
      - name: Regression tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Critical journey E2E
        run: npm run test:e2e
