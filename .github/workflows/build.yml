name: Aqua Nexus Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aqua
          POSTGRES_PASSWORD: aqua
          POSTGRES_DB: aqua_nexus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aqua -d aqua_nexus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://aqua:aqua@127.0.0.1:5432/aqua_nexus
      DATABASE_SSL: disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Regression tests
        run: npm test
      - name: Apply PostgreSQL migrations
        run: |
          psql "$DATABASE_URL" -f db/migrations/001_backend.sql
          psql "$DATABASE_URL" -f db/migrations/002_push_state.sql
          psql "$DATABASE_URL" -f db/migrations/003_vercel_push_reminders.sql
          psql "$DATABASE_URL" -f db/migrations/004_rate_limits.sql
      - name: Build
        run: npm run build
      - name: Backend integration
        run: npm run test:backend
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Critical journey E2E
        run: npm run test:e2e
      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: test-results
          if-no-files-found: ignore
          retention-days: 3
